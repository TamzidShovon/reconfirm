[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reconfirm"
version = "0.1.0"
description = "Attack-surface recon in pure Python - subdomains, open ports, exposed secrets, cloud storage - grading every result confirmed, unverified or discarded."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
reconfirm = "reconfirm.cli:main"

[tool.setuptools.packages.find]
include = ["reconfirm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
